<!DOCTYPE html>
<html>

<head>
    <title>Create a Wizard Profile</title>
</head>

<body>

    <!-- Main Heading -->
    <h1>Create a Wizard Profile</h1>

    <!-- Form Starts -->
    <form>

        <!-- Wizard Name -->
        <label>Wizard Name:</label><br>
        <input type="text" placeholder="Enter wizard name"><br><br>

        <!-- House -->
        <label>House:</label><br>
        <input type="text" placeholder="Enter house name"><br><br>

        <!-- Wand Type -->
        <label>Wand Type:</label><br>
        <input type="text" placeholder="Enter wand type"><br><br>

        <!-- Year of Enrollment -->
        <label>Year of Enrollment:</label><br>
        <input type="number" placeholder="Enter year"><br><br>

        <!-- Date of First Spell Cast -->
        <label>Date of First Spell Cast:</label><br>
        <input type="date"><br><br>

        <!-- Robe Color Picker -->
        <label>Robe Color:</label><br>
        <input type="color"><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Create Profile">

    </form>
    <!-- Form Ends -->

</body>

</html>
