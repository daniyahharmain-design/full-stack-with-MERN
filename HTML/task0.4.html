<!DOCTYPE html>
<html>

<head>
    <title>Register for Event</title>
</head>

<body>

    <!-- Heading -->
    <h1>Register for Event</h1>

    <!-- Form Starts -->
    <form>

        <!-- Name -->
        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name"><br><br>

        <!-- Session Dropdown -->
        <label>Select Session:</label><br>
        <select name="session">
            <option>Morning</option>
            <option>Afternoon</option>
            <option>Evening</option>
        </select><br><br>

        <!-- Special Requests -->
        <label>Special Requests:</label><br>
        <textarea rows="4" placeholder="Enter your request here"></textarea><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Register">

    </form>

</body>

</html>
