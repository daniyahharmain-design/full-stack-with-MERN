<!DOCTYPE html>
<html>

<head>
    <title>Google Search Form</title>
</head>

<body>

    <!-- Main Heading -->
    <h1>Google Search</h1>

    <!-- Form starts -->
    <!-- action sends the data to Google's search page -->
    <form action="https://www.google.com/search" method="get">

        <!-- Search Input -->
        <label>Search Anything:</label><br>
        <!-- name="q" is required because Google expects the search query in 'q' -->
        <input type="text" name="q" placeholder="Enter your search here"><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Search Google">

    </form>
    <!-- Form ends -->

</body>

</html>
