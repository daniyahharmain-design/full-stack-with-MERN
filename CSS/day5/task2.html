<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge System</title>
    <link rel="stylesheet" href="task2.css">
</head>
<body>

    <h1>Display Properties & Badge System</h1>

    <!-- Display Mode Boxes -->
    <section class="display-section">
        <h2>Display Modes</h2>

        <div class="box block-mode">Block Mode</div>
        <div class="box inline-mode">Inline Mode</div>
        <div class="box inline-block-mode">Inline-Block Mode</div>
    </section>

    <!-- Product Badge System -->
    <section class="products">
        <h2>Products</h2>

        <div class="product">
            <h3>Wireless Headphones
                <span class="badge new">NEW</span>
            </h3>
        </div>

        <div class="product">
            <h3>Gaming Mouse
                <span class="badge sale">SALE</span>
            </h3>
        </div>

        <div class="product">
            <h3>Smart Watch
                <span class="badge hot">HOT</span>
            </h3>
        </div>

        <div class="product">
            <h3>Laptop Stand
                <span class="badge limited">LIMITED</span>
            </h3>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="#" class="social-icon">Facebook</a>
            <a href="#" class="social-icon">Twitter</a>
            <a href="#" class="social-icon">Instagram</a>
            <a href="#" class="social-icon">LinkedIn</a>
        </div>
    </footer>

</body>
</html>
